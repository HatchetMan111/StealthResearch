# Kopieren nach config.yaml -- oder alles leer lassen und nur bei Bedarf anpassen.
# Kein AI-Zwang: Preise/Verfügbarkeit werden deterministisch per Parser
# (JSON-LD + Selektoren) extrahiert, kein Ollama nötig.
# Token kann auch per Umgebungsvariable gesetzt werden: SCRAPER_TOKEN

server:
  host: "0.0.0.0"
  port: 8001
  api_token: ""   # leer = kein Auth (nur Heimnetz!). Sonst Header X-Token: ...

scraper:
  timeout_seconds: 30
  headless: true
  locale: "de-DE"
  timezone: "Europe/Berlin"
  viewport_width: 1366
  viewport_height: 768
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  block_images: true   # true = schneller/sparsamer, false = wenn Bilder für Lazy-Load nötig
  proxy: ""            # z.B. http://user:pass@proxy:8080 -- leer = direkt
  # Optionale Standard-Wartezeit nach Load (ms), damit JS-Preise nachladen können
  extra_wait_ms: 1500

cache:
  db_path: "data/cache.db"
  ttl_hours: 6   # 0 = Cache aus

output:
  results_dir: "data/results"  # JSON-Ablage bei --target all / Timer-Läufen

# Preis-/Verfügbarkeits-Monitoring: beliebig viele Ziele, kein Code nötig.
# Check via: POST /targets/check  oder  python -m app.main --target all
targets:
  - name: "beispiel-shop"
    enabled: false
    url: "https://example.com/produkt/123"
    wait_for: ""        # optional CSS-Selektor, auf den gewartet wird
    selectors:          # optional eigene Selektoren (überschreiben Auto-Erkennung)
      preis: ".price"
      verfuegbarkeit: ".stock"

# Schnäppchen-Watcher: Such-URLs regelmäßig prüfen, Deals per Median erkennen.
# Ablauf: im Browser filtern (Suchbegriff, PLZ + Umkreis z.B. 10 km, Preis,
# "Neueste zuerst") -> URL kopieren -> als Watch anlegen (Dashboard Sektion 4
# oder hier). Gleiches Prinzip für alle Anbieter (kleinanzeigen, mobile.de,
# autoscout24, ebay, idealo, generisch mit eigenen Selektoren).
watcher:
  enabled: true
  db_path: "data/deals.db"

watches:
  - name: "beispiel-watch"
    enabled: false
    provider: "auto"   # oder kleinanzeigen/mobile/autoscout/ebay/idealo/generisch
    search_url: "https://www.kleinanzeigen.de/s-laptop/12345-musterstadt/preis::500/..."
    query: "Laptop"    # nur Doku/Anzeige
    plz: "12345"       # nur Doku/Anzeige
    radius_km: 10      # nur Doku/Anzeige (Umkreis steckt in der kopierten URL)
    max_preis: 500
    deal_schwelle_prozent: 25  # X % unter Median = Deal (UNTER_MARKT)
    min_angebote: 5            # Mindest-Treffer mit Preis für verlässlichen Median
    max_seiten: 2              # Trefferseiten pro Prüfung (max. 5)
    interval_minutes: 60       # Prüf-Abstand dieser Suche (min. 15, Bot-Schutz!)
    notify_webhook: ""         # optional: POST als JSON bei neuen Deals
    selectors: {}              # optional eigene Selektoren (item/titel/preis/link/ort)
